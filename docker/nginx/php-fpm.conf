# Shared by every server block that serves the Laravel app (public HTTPS
# vhost and the internal-only vhost alike) — included rather than
# duplicated so the two can't drift out of sync.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    fastcgi_pass web:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

location ~ /\.(?!well-known).* {
    deny all;
}
