# Included from docker/nginx/app.conf's server block rather than inlined,
# so the routing/FastCGI rules have one home.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    # `fastcgi_pass web:9000;` (a bare hostname) resolves once when the
    # nginx worker starts and caches that IP for its whole lifetime — so
    # recreating the `web` container on every deploy (new container, new
    # IP) leaves nginx pointing at a dead address until nginx itself is
    # also restarted, producing "502 / connect() failed (111: Connection
    # refused)". Using Docker's embedded DNS resolver with a variable
    # forces nginx to re-resolve per request instead, so a fresh `web`
    # container is picked up automatically without touching nginx.
    resolver 127.0.0.11 valid=10s;
    set $upstream_web web:9000;
    fastcgi_pass $upstream_web;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}

location ~ /\.(?!well-known).* {
    deny all;
}
