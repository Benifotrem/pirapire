# Plain HTTP only — nginx has no publicly reachable port (see
# docker-compose.yml), so the only thing that ever connects here is the
# `cloudflared` service over the private Docker network at
# http://nginx:80. TLS is terminated at Cloudflare's edge before the
# request ever reaches the tunnel, so there's no certificate to configure
# on this end. See README "Cloudflare Tunnel".
server {
    listen 80;
    server_name pirapire.pro www.pirapire.pro;
    root /var/www/html/public;
    index index.php;

    # Recovers the real visitor IP from Cloudflare's CF-Connecting-IP
    # header instead of $remote_addr, which would otherwise be the
    # cloudflared container's address on the Docker network. Trusting
    # this header unconditionally from any source is safe specifically
    # because nginx isn't reachable from anywhere but that private
    # network — nothing external can forge the header directly against
    # nginx (Cloudflare itself sets/overwrites it at the edge).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 20M;

    # No `fastcgi_param HTTPS on` here — Laravel infers the original
    # scheme from the X-Forwarded-Proto header that Cloudflare/cloudflared
    # sends through (nginx forwards all incoming headers to PHP-FPM by
    # default), combined with the trusted-proxy config in
    # web/bootstrap/app.php. That's what makes url()/route() generate
    # https:// links even though this nginx<->PHP-FPM hop is plain HTTP.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/php-fpm.conf;
}
