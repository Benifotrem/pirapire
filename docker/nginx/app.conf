# Plain HTTP: redirect to HTTPS. Cloudflare's own edge already forces
# HTTPS for visitors in "Full (strict)" mode (it only ever talks to the
# origin over :443), so this exists purely to cover anyone who reaches
# the VPS's IP directly on :80, bypassing Cloudflare.
server {
    listen 80;
    server_name pirapire.pro www.pirapire.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pirapire.pro www.pirapire.pro;
    root /var/www/html/public;
    index index.php;

    # Cloudflare Origin Certificate — see README "HTTPS con Cloudflare".
    # Cloudflare's edge is the only thing that needs to trust this (it's
    # signed by Cloudflare's own CA, not a public one), which is exactly
    # what "Full (strict)" mode checks for.
    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;
    fastcgi_param HTTPS on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/php-fpm.conf;
}

# Internal-only vhost for container-to-container calls (the WhatsApp bot
# hitting routes/api.php) — plain HTTP, no redirect. NOT published in
# docker-compose.yml's `ports:`, so it's unreachable from outside the
# Docker network; the :80 redirect above would otherwise 301 these calls
# into a hostname ("nginx") the Cloudflare Origin Certificate was never
# issued for, breaking every bot<->Laravel request.
server {
    listen 8080;
    server_name nginx;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    include /etc/nginx/php-fpm.conf;
}
