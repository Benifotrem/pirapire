# Plain HTTP: redirect to HTTPS. Cloudflare's own edge already forces
# HTTPS for visitors in "Full (strict)" mode, but this also covers anyone
# who reaches the VPS's IP directly on :80, bypassing Cloudflare.
server {
    listen 80;
    server_name pirapire.pro www.pirapire.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pirapire.pro www.pirapire.pro;
    root /var/www/html/public;
    index index.php;

    # Cloudflare Origin Certificate — see README "HTTPS con Cloudflare".
    # Cloudflare's edge is the only thing that needs to trust this (it's
    # signed by Cloudflare's own CA, not a public one), which is exactly
    # what "Full (strict)" mode checks for.
    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass web:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
