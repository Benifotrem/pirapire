name: pirapire

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # No `ports:` — nginx is not reachable from outside the Docker network
    # at all. The only way in is through the `cloudflared` service below,
    # over the private network, at http://nginx:80. See README "Cloudflare
    # Tunnel" for how the tunnel routes pirapire.pro to that address.
    volumes:
      # Bind-mounted from the host, so it must be built *before* `docker
      # compose up`:
      #   cd web && npm install && npm run build
      # The `web` service below mounts this same host directory (not just
      # the image's own baked-in copy) so nginx and PHP-FPM can't disagree
      # about which build is current.
      - ./web/public:/var/www/html/public:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/php-fpm.conf:/etc/nginx/php-fpm.conf:ro
    depends_on:
      - web

  # Outbound-only connection from the VPS to Cloudflare's edge — Cloudflare
  # routes pirapire.pro to this tunnel and forwards requests down it to
  # `http://nginx:80`, so nginx (and everything behind it) never needs a
  # publicly reachable port. TLS is terminated at Cloudflare's edge; see
  # README "Cloudflare Tunnel" for how to create the tunnel and get the
  # token that goes in CLOUDFLARE_TUNNEL_TOKEN.
  #
  # Gated behind the "production" profile so a plain local `docker compose
  # up` never tries to start it (no token needed for local dev, where
  # nginx is reached directly instead — see docker-compose.local.yml).
  # On the VPS, set `COMPOSE_PROFILES=production` in the root .env so
  # every `docker compose` command picks this up automatically, with no
  # extra flags to remember.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["production"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

  web:
    build:
      context: ./web
    restart: unless-stopped
    env_file: ./web/.env
    volumes:
      - ./web/storage:/var/www/html/storage
      # Without this, PHP-FPM renders @vite() asset URLs from the
      # manifest.json baked into the image at `docker compose build` time
      # (see web/Dockerfile's `assets` stage) — a *different* copy of
      # public/build than the one nginx serves straight off the host (see
      # the nginx service's volumes below). Running `npm run build` after
      # `docker compose build` (or vice versa) then leaves the two
      # disagreeing: nginx serves the fresh CSS/JS files fine, but the HTML
      # PHP-FPM renders still links to the old, now-404ing hashed
      # filenames. Bind-mounting the same host directory here keeps both
      # looking at one source of truth.
      - ./web/public:/var/www/html/public
    depends_on:
      - db
      - redis

  queue:
    build:
      context: ./web
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    env_file: ./web/.env
    volumes:
      - ./web/storage:/var/www/html/storage
    depends_on:
      - db
      - redis

  scheduler:
    build:
      context: ./web
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: ./web/.env
    volumes:
      - ./web/storage:/var/www/html/storage
    depends_on:
      - db
      - redis
      - tor

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pirapire}
      POSTGRES_USER: ${DB_USERNAME:-pirapire}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Self-hosted LNbits instance used by the escrow service (see
  # web/app/Services/Lightning/LnbitsClient.php) via its core payments
  # API — no extension needed (LNbits has no "hold invoice" extension).
  # Ships here with the FakeWallet funding source so `docker compose up`
  # works out of the box for local development — it does NOT move real
  # sats. Before going to production, set LNBITS_BACKEND_WALLET_CLASS to
  # a real backend (LndRestWallet, CoreLightningWallet, etc.) pointing at
  # your own Lightning node.
  lnbits:
    image: lnbitsdocker/lnbits-legend:latest
    restart: unless-stopped
    environment:
      LNBITS_BACKEND_WALLET_CLASS: ${LNBITS_BACKEND_WALLET_CLASS:-FakeWallet}
      # Only read when LNBITS_BACKEND_WALLET_CLASS=BlinkWallet — points
      # LNbits at Blink's hosted API/websocket instead of a self-hosted
      # node, so no channels or liquidity to manage on this VPS. See
      # README "Desarrollo local" (FakeWallet vs. backend real) and
      # https://dev.blink.sv/examples/lnbits-funding-source for how to
      # get BLINK_TOKEN from https://dashboard.blink.sv.
      BLINK_API_ENDPOINT: ${BLINK_API_ENDPOINT:-https://api.blink.sv/graphql}
      BLINK_WS_ENDPOINT: ${BLINK_WS_ENDPOINT:-wss://ws.blink.sv/graphql}
      BLINK_TOKEN: ${BLINK_TOKEN:-}
      # No LNBITS_DATABASE_URL: that's specifically for a Postgres
      # connection string (e.g. postgres://...) — setting it at all,
      # even to a sqlite-looking value, pushes LNbits' migration code
      # down the Postgres path (it ran an information_schema.tables
      # query against a SQLite connection and crashed on startup).
      # Leaving it unset makes LNbits default to SQLite under
      # LNBITS_DATA_FOLDER (default /app/data, matching the volume
      # mount below) with no further config needed.
    volumes:
      - lnbits_data:/app/data
    # No `ports:` — not reachable from outside the Docker network, nor
    # from the VPS host's own localhost (same reasoning as nginx above).
    # To reach the LNbits web UI (e.g. to copy the Admin/Invoice-read keys
    # on first setup), either add a second public hostname to the
    # Cloudflare Tunnel pointing at http://lnbits:5000 and gate it behind
    # Cloudflare Access, or temporarily add `- "127.0.0.1:5000:5000"`
    # here, `docker compose up -d lnbits` to apply it, do what you need
    # against http://127.0.0.1:5000 over an SSH tunnel to the VPS, then
    # remove the line and `docker compose up -d lnbits` again. See README
    # "Cloudflare Tunnel".

  # Local SOCKS5 proxy into the Tor network, for reaching RoboSats when its
  # only reliable endpoint is a .onion address (many community/official
  # instances are Tor-only, or rate-limit clearnet mirrors more
  # aggressively). Optional: robosats:poll works over clearnet with no
  # proxy at all if ROBOSATS_PROXY_URL is left unset — see
  # App\Services\RoboSats\RoboSatsClient and README "Configuración de
  # RoboSats (Tor / proxy)". Cheap enough to leave running even when unused.
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    # No `ports:` — only `scheduler` needs this, reachable over the
    # private Docker network at tor:9050 (see ROBOSATS_PROXY_URL). No
    # reason to publish a SOCKS5 proxy to the internet.

volumes:
  db_data:
  redis_data:
  lnbits_data:
