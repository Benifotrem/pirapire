name: pirapire

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web/public:/var/www/html/public:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    build:
      context: ./web
    restart: unless-stopped
    env_file: ./web/.env
    volumes:
      - ./web/storage:/var/www/html/storage
    depends_on:
      - db
      - redis

  queue:
    build:
      context: ./web
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    env_file: ./web/.env
    volumes:
      - ./web/storage:/var/www/html/storage
    depends_on:
      - db
      - redis

  scheduler:
    build:
      context: ./web
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: ./web/.env
    volumes:
      - ./web/storage:/var/www/html/storage
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pirapire}
      POSTGRES_USER: ${DB_USERNAME:-pirapire}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  whatsapp-bot:
    build:
      context: ./whatsapp-bot
    restart: unless-stopped
    env_file: ./whatsapp-bot/.env
    volumes:
      - whatsapp_auth:/app/auth_sessions
    depends_on:
      - redis
      - web

  # Self-hosted LNbits instance used by the escrow service (see
  # web/app/Services/Lightning/LnbitsClient.php). Ships here with the
  # FakeWallet funding source so `docker compose up` works out of the box
  # for local development — it does NOT move real sats. Before going to
  # production, set LNBITS_BACKEND_WALLET_CLASS to a real backend (LndRestWallet,
  # CoreLightningWallet, etc.) pointing at your own Lightning node, and
  # install/enable the "Hold Invoice" extension from the LNbits admin UI.
  lnbits:
    image: lnbitsdocker/lnbits-legend:latest
    restart: unless-stopped
    environment:
      LNBITS_BACKEND_WALLET_CLASS: ${LNBITS_BACKEND_WALLET_CLASS:-FakeWallet}
      LNBITS_DATABASE_URL: sqlite:///data/database.sqlite3
    volumes:
      - lnbits_data:/app/data
    ports:
      - "5000:5000"

volumes:
  db_data:
  redis_data:
  whatsapp_auth:
  lnbits_data:
