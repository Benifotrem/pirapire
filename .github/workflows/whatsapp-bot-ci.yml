name: WhatsApp Bot CI

on:
  push:
    branches: [main]
    paths: ["whatsapp-bot/**", ".github/workflows/whatsapp-bot-ci.yml"]
  pull_request:
    paths: ["whatsapp-bot/**", ".github/workflows/whatsapp-bot-ci.yml"]

defaults:
  run:
    working-directory: whatsapp-bot

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: whatsapp-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm test
